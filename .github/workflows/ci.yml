name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  sdk-guard:
    name: SDK file guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python tools/check_sdk_files.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The layout tests build their probes with the runner's native C++ compiler: MSVC, GCC,
      # or Apple clang on arm64 (macos-latest) and x86_64 (macos-15-intel). They fail instead
      # of skipping when it is missing.
      PYSTEAMSDK_REQUIRE_CXX: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.15" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.15" }
          - { os: macos-15-intel, python: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $paths = @()
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($name -eq 'Path') {
              $paths = @($value -split ';' | Where-Object { $_ -and ($before.Path -split ';') -notcontains $_ })
            } elseif ($before[$name] -ne $value) {
              "$name=$value" | Add-Content $env:GITHUB_ENV
            }
          }
          # Each line is put first on PATH, so add them in reverse to keep vcvars' order.
          [array]::Reverse($paths)
          $paths | Add-Content $env:GITHUB_PATH
      - name: Show the C++ compiler
        run: if [ "$RUNNER_OS" = Windows ]; then cl; else c++ --version; fi
      - run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - run: pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install --upgrade pip && python -m pip install --group dist
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python tools/check_sdk_files.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # No checkout: the package must import from the installed distribution alone.
      - name: Install wheel and sdist into fresh environments
        run: |
          for kind in whl tar.gz; do
            venv="$RUNNER_TEMP/venv-${kind%%.*}"
            python -m venv "$venv"
            bin="$venv/bin"; [ "$RUNNER_OS" = Windows ] && bin="$venv/Scripts"
            "$bin/python" -m pip install --quiet dist/*."$kind"
            (cd "$RUNNER_TEMP" && "$bin/python" -c "import importlib.metadata as m, pysteamsdk; assert pysteamsdk.__version__ == m.version('pysteamsdk'); print('$kind', pysteamsdk.__version__)")
          done
