# Pointer parameters a flat function keeps after it returns. With holder "record" a binding
# keeps the pointed-to object alive as long as the record the function stores the pointer in;
# with "none" Steam may use it after any such object is gone, so the function is not bound.

[[retained_pointer]]
function = "SteamAPI_SteamNetworkingConfigValue_t_SetString"
param = "data"
holder = "record"
reason = """
steamnetworkingtypes.h: SetString "Just saves your pointer. Does NOT make a copy of the string",
storing it in the record's m_val.
"""

[[retained_pointer]]
function = "SteamAPI_SteamNetworkingConfigValue_t_SetPtr"
param = "data"
holder = "none"
reason = """
steamnetworkingtypes.h: SetPtr stores the pointer in m_val unchanged. Pointer settings hold
callbacks and objects that Steam keeps once the setting is applied, after the record is gone.
"""
