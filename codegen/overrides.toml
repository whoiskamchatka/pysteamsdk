# Reviewed corrections to the Steamworks SDK metadata, applied by `python -m codegen`.
#
# Each entry names its target and says why it exists. The extractor checks every entry against
# the SDK and reports it as an error, without applying it, once its target no longer looks as
# described. Add an entry only with evidence from the SDK itself, or for by_value from the call
# tests, and never to describe a struct layout: layouts come from compiling the headers.

[[interface_version]]
interface = "ISteamClient"
macro = "STEAMCLIENT_INTERFACE_VERSION"
version = "SteamClient023"
reason = """
steam_api.json gives ISteamClient no version_string and the flat API no accessor. isteamclient.h
defines this macro right after the class, and its SteamClient() accessor passes the macro to
the exported SteamInternal_CreateInterface, which is how a flat C caller reaches ISteamClient.
"""

[[shared_callback]]
callback_id = 1108
structs = ["GSStatsUnloaded_t", "UserStatsUnloaded_t"]
reason = """
isteamgameserverstats.h and isteamuserstats.h both declare this callback as
k_iSteamUserStatsCallbacks + 8 with one identical CSteamID member: the same notification,
named once for game servers and once for clients. The ID stays shared and either struct reads
the payload.
"""

[[external_type]]
name = "CSteamID"
declaration = "class"
header = "steamclientpublic.h"
reason = """
A C++ class steam_api.json does not describe. Flat functions take and return it as
uint64_steamid, but callback structs hold the class itself.
"""

[[external_type]]
name = "CGameID"
declaration = "class"
header = "steamclientpublic.h"
reason = """
A C++ class steam_api.json does not describe. Flat functions take and return it as
uint64_gameid, but structs hold the class itself.
"""

[[external_type]]
name = "SteamAPIWarningMessageHook_t"
declaration = "typedef"
header = "steam_api_common.h"
reason = """
A function pointer type that two SetWarningMessageHook methods take, missing from
steam_api.json's typedefs.
"""

[[external_type]]
name = "ScePadTriggerEffectParam"
declaration = "struct"
header = "isteamdualsense.h"
reason = """
The DualSense trigger effect struct, defined outside steam_api.json. ISteamInput only takes a
pointer to it.
"""

[[external_type]]
name = "SteamInputActionEvent_t::AnalogAction_t"
declaration = "struct"
header = "isteaminput.h"
reason = """
Nested in SteamInputActionEvent_t, inside an anonymous union that steam_api.json reduces to its
analogAction member. The union's real layout must come from the header.
"""

[[external_type]]
name = "CallbackMsg_t"
declaration = "struct"
header = "steam_api_internal.h"
reason = """
The message SteamAPI_ManualDispatch_GetNextCallback fills, which steam_api.json does not
describe. It is packed as callbacks are, so its layout differs between Windows and the rest.
pysteamsdk's runtime reads it to dispatch callbacks.
"""

[[external_type]]
name = "SteamDatagramRelayAuthTicket"
declaration = "incomplete"
header = "steamnetworkingtypes.h"
reason = """
Only forward-declared: no SDK header defines it. ISteamNetworkingSockets takes it by pointer.
"""

[[external_type]]
name = "ISteamNetworkingConnectionSignaling"
declaration = "incomplete"
header = "isteamnetworkingsockets.h"
reason = """
Only forward-declared: no SDK header defines it. ConnectP2PCustomSignaling takes it by pointer.
"""

[[external_type]]
name = "ISteamNetworkingSignalingRecvContext"
declaration = "incomplete"
header = "isteamnetworkingsockets.h"
reason = """
Only forward-declared: no SDK header defines it. ReceivedP2PCustomSignal takes it by pointer.
"""

# How ctypes may pass each record a flat function takes or returns by value. A target is direct
# only where tests/codegen/test_abi_calls.py has shown ctypes passing a record of the same shape
# as the native compiler does, and shim where it has shown that ctypes does not. Every other
# target is unverified, so no binding may pass the record directly there. The SDK tests check
# that each fixture record still has the shape of the SDK record it stands for.

[[by_value]]
record = "InputAnalogActionData_t"
direct = ["windows-x86_64", "linux-x86_64"]
shim = []
reason = """
Returned by value: 13 bytes packed to 1, an enum, two floats and a bool. ctypes returns Stick
from tests/codegen/fixtures/calls.h, of the same shape, as MSVC 19.44 and GCC 15.2 do.
"""

[[by_value]]
record = "InputDigitalActionData_t"
direct = ["windows-x86_64", "linux-x86_64"]
shim = []
reason = """
Returned by value: two bools in 2 bytes. ctypes returns Button, of the same shape, as MSVC
19.44 and GCC 15.2 do.
"""

[[by_value]]
record = "InputMotionData_t"
direct = ["windows-x86_64", "linux-x86_64"]
shim = []
reason = """
Returned by value: ten floats in 40 bytes packed to 1, which both ABIs return through a hidden
pointer. ctypes returns Motion, of the same shape, as MSVC 19.44 and GCC 15.2 do.
"""

[[by_value]]
record = "SteamIPAddress_t"
direct = ["windows-x86_64", "linux-x86_64"]
shim = []
reason = """
Taken and returned by value: a 16-byte union and an enum in 20 bytes packed to 1, which both
ABIs pass in memory. ctypes passes and returns Address, of the same shape, as MSVC 19.44 and
GCC 15.2 do.
"""

[[by_value]]
record = "SteamPartyBeaconLocation_t"
direct = ["windows-x86_64"]
shim = ["linux-x86_64"]
reason = """
Taken by value: an enum and a uint64. Callbacks are packed to 8 on Windows, where ctypes passes
Location, of the same shape, as MSVC 19.44 does. Off Windows they are packed to 4, which puts
the uint64 at offset 4: SysV then passes the 12 bytes in memory, ctypes passes them in
registers, and GCC 15.2's callee reads garbage. macOS x86-64 follows the same ABI but is
unverified until a Mac runs the test.
"""

# Function pointer parameters Steam may call back. Each needs header evidence that Steam calls
# the function on the thread of a call made into Steam, where a Python function can safely run.
# The signature is read from the typedef's declaration. SetDebugOutputFunction is left out:
# isteamnetworkingutils.h says Steam calls it "from a service thread, while we own a mutex".

[[callback]]
function = "SteamAPI_ISteamClient_SetWarningMessageHook"
param = "pFunction"
reason = """
isteamclient.h: "callbacks will occur directly after the API function is called that generated
the warning or message", so on the thread that made that call.
"""

[[callback]]
function = "SteamAPI_ISteamUtils_SetWarningMessageHook"
param = "pFunction"
reason = """
isteamutils.h: "callbacks will occur directly after the API function is called that generated
the warning or message", so on the thread that made that call.
"""

[[callback]]
function = "SteamAPI_ISteamInput_EnableActionEventCallbacks"
param = "pCallback"
reason = """
isteaminput.h: "this is called within either SteamInput()->RunFrame or by SteamAPI_RunCallbacks",
and pysteamsdk dispatches manually, so only ISteamInput's RunFrame calls it.
"""

[[callback]]
function = "SteamAPI_ISteamNetworkingUtils_SetGlobalCallback_SteamNetConnectionStatusChanged"
param = "fnCallback"
reason = """
isteamnetworkingsockets.h: RunCallbacks will "Invoke all callback functions queued for this
interface", so Steam queues these calls for the thread that runs them.
"""

